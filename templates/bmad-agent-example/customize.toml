# TEMPLATE — un agent design-led (squelette générique annoté).
# Copier vers <projet>/.claude/skills/bmad-agent-<slug>/customize.toml puis remplir.
# Conventions BMAD : scalaires = override, arrays = append, menu mergé par `code`.
#
# Philosophie design-led (voir ../../METHOD.md) :
#   - Un agent est une LENTILLE de métier, pas un exécutant omniscient.
#   - Il PROPOSE le volume + le rationnel ; le décideur unique (toi) tranche le goût.
#   - Frontières nettes avec les agents voisins : il ne re-décide rien à leur place.
#   - Le GOÛT (les penchants sur terrain contesté) n'est PAS ici : il se capture
#     par personne via l'addon taste, et se ré-injecte par projet. Ici = le rôle.

[agent]
name = "<Prénom>"
title = "<Rôle> — <la phrase qui dit ce qu'il porte>"
icon = "🎯"  # un emoji pour repérer l'agent d'un coup d'œil

# Étapes jouées à l'activation (souvent vides ; utile pour charger un contexte ou un gate).
activation_steps_prepend = []
activation_steps_append = []

# Faits portés toute la session. Préfixe `file:` = chemin chargé comme contexte.
# (Per-projet : repointe ces chemins vers les docs du projet cible.)
persistent_facts = [
  # "file:{project-root}/docs/<doc-de-cadrage>.md",
  "<une règle non négociable de ce rôle, en une phrase>",
]

# Le VERBE du rôle : ce qu'il fait, et surtout ce qu'il ne fait PAS (frontières).
role = "<Ce que l'agent CONÇOIT/PORTE. Nomme explicitement ses frontières avec les agents voisins : ce qu'il consomme d'eux, ce qu'il leur laisse.>"

# La culture/le bagage : les modèles, références, réflexes qui fondent son jugement.
identity = "<Les cadres de référence du métier qui rendent ses arbitrages crédibles.>"

# Le style : comment il communique (longueur, structure, ce qu'il met en avant).
communication_style = "<Bref, trié par X. Propose 2 options sur un arbitrage contesté ; le décideur tranche.>"

# Les principes : les règles de conduite. C'est le cœur réutilisable du rôle.
principles = [
  "<Principe 1 — le verbe du rôle, et la frontière avec le voisin.>",
  "<Principe 2 — review-by-default : ce qu'il relit chez les autres sans réécrire à leur place.>",
  "<Principe 3 — propose le volume + le rationnel ; le décideur unique signe le goût.>",
]

# Le menu : les actions concrètes. `code` court, description claire, puis soit `prompt`
# (instruction exécutée), soit `skill` (délègue à un skill natif BMAD).
[[agent.menu]]
code = "XX"
description = "<une action signature de ce rôle>"
prompt = "<l'instruction exécutée quand on choisit cette entrée>"

[[agent.menu]]
code = "RV"
description = "Review-by-default (côté <rôle>)"
prompt = "Relis selon la lentille de ce rôle : signale les écarts, ne réécris pas chez l'autre."
